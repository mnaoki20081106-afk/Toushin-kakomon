name: 過去問ダウンロード

on:
  workflow_dispatch:
    inputs:
      groups:
        description: "実行するグループ名（スペース区切り。空なら全部）例: MARCH  または  旧帝大 TOCKY 共通テスト"
        required: false
        default: ""
      years:
        description: "末尾から何年分ダウンロードするか"
        required: false
        default: "20"
      delay:
        description: "リクエスト間隔（秒）"
        required: false
        default: "1.5"
      only:
        description: "大学名の一部で絞り込み（スペース区切り、テスト用。空なら選択グループの全大学。共通テストグループには無効）"
        required: false
        default: ""
      drive_root_name:
        description: "Googleドライブ上に作成するルートフォルダ名"
        required: false
        default: "過去問"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.set.outputs.groups }}
    steps:
      - id: set
        env:
          INPUT_GROUPS: ${{ inputs.groups }}
        run: |
          valid="旧帝大 TOCKY 早慶上理 MARCH 関関同立 日東駒専 共通テスト"
          if [ -z "$INPUT_GROUPS" ]; then
            groups="$valid"
          else
            groups="$INPUT_GROUPS"
            for g in $groups; do
              case " $valid " in
                *" $g "*) ;;
                *) echo "::error::未知のグループ名です: $g (有効な値: $valid)"; exit 1 ;;
              esac
            done
          fi
          json=$(python3 -c "import json,sys; print(json.dumps(sys.argv[1].split(), ensure_ascii=False))" "$groups")
          echo "groups=$json" >> "$GITHUB_OUTPUT"

  download:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.prepare.outputs.groups) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Google Drive APIクライアントのインストール
        run: pip install google-api-python-client google-auth

      # 共通テスト/センター試験はログイン不要のtoshin.com公開ページなので
      # Playwright(ログイン用ブラウザ)は不要。大学グループの時だけ入れる。
      - name: Playwrightセットアップ
        if: ${{ matrix.group != '共通テスト' }}
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: ダウンロード実行（大学別）
        if: ${{ matrix.group != '共通テスト' }}
        env:
          GROUP: ${{ matrix.group }}
          YEARS: ${{ inputs.years }}
          DELAY: ${{ inputs.delay }}
          ONLY: ${{ inputs.only }}
          TOSHIN_EMAIL: ${{ secrets.TOSHIN_EMAIL }}
          TOSHIN_PASSWORD: ${{ secrets.TOSHIN_PASSWORD }}
        run: |
          python3 download_kakomon.py \
            --group "$GROUP" \
            --years "$YEARS" \
            --delay "$DELAY" \
            --skip-kyotsu \
            --out downloads \
            ${ONLY:+--only $ONLY}

      - name: ダウンロード実行（共通テスト・センター試験）
        if: ${{ matrix.group == '共通テスト' }}
        env:
          YEARS: ${{ inputs.years }}
          DELAY: ${{ inputs.delay }}
        run: |
          python3 download_kakomon.py \
            --skip-universities \
            --years "$YEARS" \
            --delay "$DELAY" \
            --out downloads

      - name: Googleドライブへ直接アップロード
        env:
          GROUP: ${{ matrix.group }}
          DRIVE_ROOT_NAME: ${{ inputs.drive_root_name }}
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: |
          python3 upload_to_drive.py \
            --src downloads \
            --group "$GROUP" \
            --root-folder-id "$GDRIVE_ROOT_FOLDER_ID" \
            --root-name "${DRIVE_ROOT_NAME:-過去問}"
